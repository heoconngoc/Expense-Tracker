<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">Personal Finance</p>
        <h1>Expense Tracker</h1>
      </div>
    </header>

    <dialog id="transaction-dialog">
      <form id="transaction-form">
        <h2>Add Transaction</h2>
    
        <label>
          Name
          <input id="transaction-name" type="text" required>
        </label>
    
        <label>
          Amount
          <input id="transaction-amount" type="number" min="0.01" step="any" required>
        </label>
    
        <label>
          Type
          <select id="transaction-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
    
        <label>
          Date
          <input id="transaction-date" type="date" required>
        </label>
    
        <label>
          Category
          <select id="transaction-category" required></select>
        </label>
    
        <label>
          Account
          <select id="transaction-account" required></select>
        </label>
    
        <label>
          Notes
          <textarea id="transaction-notes"></textarea>
        </label>
    
        <p id="form-error" class="form-error"></p>
    
        <div class="form-actions">
          <button type="button" id="cancel-transaction">
            Cancel
          </button>
    
          <button type="submit">
            Save
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="transfer-dialog">
      <form id="transfer-form">
        <h2>New Transfer</h2>

        <label>
          From account
          <select id="transfer-source" required></select>
        </label>

        <label>
          To account
          <select id="transfer-destination" required></select>
        </label>

        <label>
          Sent amount
          <input id="transfer-sent" type="number" min="0.01" step="any" required>
        </label>

        <label>
          Received amount
          <input id="transfer-received" type="number" min="0.01" step="any">
        </label>

        <label>
          Exchange rate
          <input id="transfer-rate" type="number" min="0" step="any" required>
        </label>

        <label>
          Sent date
          <input id="transfer-sent-date" type="date" required>
        </label>

        <label>
          Received date
          <input id="transfer-received-date" type="date">
        </label>

        <label>
          Status
          <select id="transfer-status">
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
          </select>
        </label>

        <p id="transfer-error" class="form-error"></p>

        <div class="form-actions">
          <button type="button" id="cancel-transfer">
            Cancel
          </button>

          <button type="submit">
            Save
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="complete-transfer-dialog">
      <form id="complete-transfer-form">
        <h2>Complete Transfer</h2>

        <p id="complete-transfer-info" class="muted"></p>

        <label>
          Received amount
          <input id="complete-received" type="number" min="0.01" step="any" required>
        </label>

        <label>
          Received date
          <input id="complete-received-date" type="date" required>
        </label>

        <p id="complete-transfer-error" class="form-error"></p>

        <div class="form-actions">
          <button type="button" id="cancel-complete-transfer">
            Cancel
          </button>

          <button type="submit">
            Complete
          </button>
        </div>
      </form>
    </dialog>

    <section>
      <div class="section-header">
        <h2>Summary</h2>
    
        <div class="filters">
          <label>
            Month
            <input id="month-filter" type="month">
          </label>
        
          <label>
            Currency
            <select id="currency-filter"></select>
          </label>
        </div>
      </div>
    
      <div class="summary-grid">
        <article class="card">
          <p>Income</p>
          <strong id="income">$0.00</strong>
        </article>
    
        <article class="card">
          <p>Expenses</p>
          <strong id="expense">$0.00</strong>
        </article>
    
        <article class="card">
          <p>Net</p>
          <strong id="net">$0.00</strong>
        </article>
      </div>
    </section>

    <section>
      <h2>Accounts</h2>
      <div id="accounts" class="account-grid"></div>
    </section>

    <section>
      <div class="section-header">
        <h2 id="transaction-form-title">
          Add Transaction
        </h2>
        <button id="add-transaction">
          + Add Transaction
        </button>
      </div>

      <div id="transactions"></div>
    </section>

    <section>
      <div class="section-header">
        <h2>Transfers</h2>
        <button id="add-transfer">
          + New Transfer
        </button>
      </div>

      <div id="transfers"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>

</html>
