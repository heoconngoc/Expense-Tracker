# nginx reverse proxy for the expense tracker.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/expense-tracker
#   sudo ln -s /etc/nginx/sites-available/expense-tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Basic auth (create once):
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd <username>
#
# HTTPS (optional, needs a domain pointing at the VM):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# Public demo (optional):
#   The second server block below serves a demo with no login on port
#   8080, backed by the "expense-tracker-demo" pm2 app (sample data,
#   reset nightly). Open port 8080 in the Azure NSG to let guests in.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # A JSON backup can be up to ~10mb, so allow a little more.
    client_max_body_size 12m;

    auth_basic "Expense Tracker";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public demo: no basic auth, sample data. Guests can add/edit freely;
# deploy/reset-demo-db.sh restores the sample data on a nightly cron.
# Access at http://<PUBLIC_IP>:8080 (open port 8080 in the Azure NSG).
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
