name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.AZURE_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VM
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'database/*.db' \
            --exclude 'database/*.db-*' \
            --exclude 'database/backups' \
            --exclude 'coverage' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }}:/var/www/expense-tracker/"

      - name: Install dependencies and reload
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }}" '
              set -e
              cd /var/www/expense-tracker
              npm ci --omit=dev
              pm2 startOrReload ecosystem.config.cjs --env production
              pm2 save
            '
